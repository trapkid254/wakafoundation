<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Finance · WAKA Foundation Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="../js/waka-data.js"></script><script src="../js/admin-shell.js"></script>
</head>
<body>
<script>
WAKA.init(); buildAdminShell('finance');
document.getElementById('pageTitle').textContent='Finance & Budget';

function render() {
  const finances = WAKA.store.get('finances',[]);
  const income = finances.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);
  const expense = finances.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);
  const balance = income - expense;
  const donations = WAKA.store.get('donations',[]);
  const donTotal = donations.filter(d=>d.status==='completed').reduce((s,d)=>s+(d.currency==='USD'?d.amount*130:d.amount),0);

  // Category breakdown
  const cats = {};
  finances.filter(f=>f.type==='expense').forEach(f=>{cats[f.category]=(cats[f.category]||0)+f.amount;});

  const typeF=(document.getElementById('fType')||{}).value||'';
  const catF=(document.getElementById('fCat')||{}).value||'';
  let filtered=finances.filter(f=>(!typeF||f.type===typeF)&&(!catF||f.category===catF));

  document.getElementById('pageContent').innerHTML = `
  <div class="page-header"><h1>💰 Finance & Budget</h1><p>Track income, expenses, and generate financial transparency reports for public disclosure.</p></div>

  <div class="stats-grid">
    <div class="stat-card"><div class="top"><div><div class="label">Total Income</div><div class="value text-green">KES ${Math.round(income/1000)}K</div></div><div class="icon-box" style="background:var(--green-pale)">📈</div></div></div>
    <div class="stat-card"><div class="top"><div><div class="label">Total Expenses</div><div class="value text-red">KES ${Math.round(expense/1000)}K</div></div><div class="icon-box" style="background:var(--red-pale)">📉</div></div></div>
    <div class="stat-card"><div class="top"><div><div class="label">Net Balance</div><div class="value text-blue">KES ${Math.round(balance/1000)}K</div></div><div class="icon-box" style="background:var(--blue-pale)">🏦</div></div></div>
    <div class="stat-card"><div class="top"><div><div class="label">Donations Received</div><div class="value">KES ${Math.round(donTotal/1000)}K</div></div><div class="icon-box" style="background:var(--gold-pale)">💳</div></div></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;margin-bottom:20px">
    <div class="card">
      <div class="card-header"><span class="card-title">All Transactions</span>
        <div class="flex gap-2">
          <select class="filter-select" id="fType" onchange="render()"><option value="">All Types</option><option value="income">Income</option><option value="expense">Expense</option></select>
          <select class="filter-select" id="fCat" onchange="render()"><option value="">All Categories</option><option>Donations</option><option>Grants</option><option>Programs</option><option>Operations</option></select>
          <button class="btn btn-primary btn-sm" onclick="openAddTx()">+ Add</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Date</th><th>Ref</th><th></th></tr></thead>
          <tbody>
            ${filtered.map(f=>`
            <tr>
              <td><span class="badge ${f.type==='income'?'badge-green':'badge-red'}">${f.type==='income'?'↑ IN':'↓ OUT'}</span></td>
              <td>${f.category}</td>
              <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.description}</td>
              <td class="fw-bold ${f.type==='income'?'text-green':'text-red'}">${WAKA.fmt.currency(f.amount)}</td>
              <td class="text-muted">${WAKA.fmt.date(f.date)}</td>
              <td class="text-muted" style="font-size:.75rem">${f.reference}</td>
              <td><button class="btn btn-outline btn-icon btn-sm" onclick="deleteTx('${f.id}')" style="color:var(--red)">🗑</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-title" style="margin-bottom:16px">📊 Expense Breakdown</div>
        <div class="chart-bar-wrap">
          ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
          <div class="chart-bar-item">
            <span class="chart-bar-label" style="font-size:.78rem">${cat}</span>
            <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${Math.round(amt/expense*100)}%;background:var(--blue)"></div></div>
            <span class="chart-bar-val">${Math.round(amt/expense*100)}%</span>
          </div>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:16px">🥧 Allocation Policy</div>
        ${[['Programs & Direct Impact','75%','var(--green)'],['Operations','13%','var(--blue)'],['Fundraising','8%','var(--gold)'],['Admin','4%','var(--red)']].map(([l,v,c])=>`
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;border-radius:50%;background:${c}"></div><span style="font-size:.83rem">${l}</span></div>
          <strong style="color:${c}">${v}</strong>
        </div>`).join('')}
        <div style="background:var(--green-pale);border-radius:8px;padding:12px;margin-top:12px;text-align:center;font-size:.82rem;color:var(--green);font-weight:600">✓ Audited Annually · Published Quarterly</div>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:12px">⚡ Quick Actions</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn btn-outline" style="width:100%;justify-content:center" onclick="exportFinances()">⬇ Export Ledger (CSV)</button>
          <a href="reports.html" class="btn btn-primary" style="width:100%;justify-content:center">📊 Generate Report</a>
        </div>
      </div>
    </div>
  </div>
  `;
}

function openAddTx() {
  openGlobalModal(`
    <h2>+ Add Transaction</h2>
    <div class="form-row">
      <div class="form-group"><label>Type *</label><select id="tx_type"><option value="income">Income</option><option value="expense">Expense</option></select></div>
      <div class="form-group"><label>Category *</label><select id="tx_cat"><option>Donations</option><option>Grants</option><option>Programs</option><option>Operations</option><option>Admin</option><option>Fundraising</option><option>Emergency</option></select></div>
    </div>
    <div class="form-group"><label>Description *</label><input id="tx_desc" placeholder="What is this transaction for?"/></div>
    <div class="form-row">
      <div class="form-group"><label>Amount (KES) *</label><input id="tx_amount" type="number" placeholder="0"/></div>
      <div class="form-group"><label>Date</label><input id="tx_date" type="date" value="${new Date().toISOString().split('T')[0]}"/></div>
    </div>
    <div class="form-group"><label>Reference</label><input id="tx_ref" placeholder="Receipt / bank ref number"/></div>
    <div class="flex gap-2">
      <button class="btn btn-outline" onclick="closeGlobalModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTx()">Save Transaction</button>
    </div>
  `);
}

function saveTx() {
  const desc=document.getElementById('tx_desc')?.value;
  const amt=parseFloat(document.getElementById('tx_amount')?.value);
  if(!desc||!amt){WAKA.notify('Fill required fields','error');return;}
  const list=WAKA.store.get('finances',[]);
  list.unshift({id:'F'+String(Date.now()).slice(-4),
    type:document.getElementById('tx_type')?.value,
    category:document.getElementById('tx_cat')?.value,
    description:desc,amount:amt,
    date:document.getElementById('tx_date')?.value,
    reference:document.getElementById('tx_ref')?.value||'MANUAL-'+Date.now()
  });
  WAKA.store.set('finances',list);
  closeGlobalModal();WAKA.notify('Transaction saved!','success');render();
}

function deleteTx(id) {
  if(!confirm('Delete this transaction?'))return;
  WAKA.store.set('finances',WAKA.store.get('finances',[]).filter(f=>f.id!==id));
  WAKA.notify('Deleted.','info');render();
}

function exportFinances() {
  const list=WAKA.store.get('finances',[]);
  const csv=['ID,Type,Category,Description,Amount,Date,Reference',
    ...list.map(f=>`${f.id},${f.type},${f.category},"${f.description}",${f.amount},${f.date},${f.reference}`)
  ].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='waka_finances.csv';a.click();
  WAKA.notify('Ledger exported!','success');
}
render();
</script>
</body>
</html>
